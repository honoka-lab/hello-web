<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Hello Web!</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin: 40px auto;
      max-width: 800px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      margin-bottom: 30px;
    }
    #chart-container {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <h1 id="message">こんにちは！</h1>
  <button onclick="changeMessage()">メッセージを変える</button>

  <h2>月別売上グラフ（サンプル）</h2>
  <div id="chart-container">
    <canvas id="myChart"></canvas>
  </div>

  <!-- Chart.js をCDNから読み込む -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    // メッセージ切り替え
    function changeMessage() {
      const msg = document.getElementById("message");
      msg.textContent = (msg.textContent === "こんにちは！") ? "ようこそGitHubへ！" : "こんにちは！";
    }

    // グラフ描画
    const ctx = document.getElementById('myChart');

    // サンプルデータ
    const labels = ["1月", "2月", "3月", "4月", "5月", "6月"];
    const data = [120, 90, 150, 80, 180, 130];

    // Chart.js で棒グラフを描く
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: '売上（万円）',
          data: data,
          // 色はChart.jsが自動でつけるから指定しなくてもOK
        }]
      },
      options: {
        responsive: true,
        scales: {
          y: {
            beginAtZero: true,
            title: {
              display: true,
              text: '万円'
            }
          }
        }
      }
    });
  </script>
</body>
</html>

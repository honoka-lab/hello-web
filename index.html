<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>資産推移（2017年10月〜2025年10月）</title>
  <style>
    body {
      font-family: 'Hiragino Maru Gothic ProN', 'Arial Rounded MT Bold', sans-serif;
      background-color: #fffafc;
      color: #555;
      text-align: center;
      margin: 30px auto;
      max-width: 100%;
    }
    h1 { color: #e86e94; }
    p { margin-bottom: 15px; }

    /* 横スクロールできるようにする */
    .scroll-wrapper {
      width: 100%;
      overflow-x: auto;
    }

    /* ←ここでがっつり幅を取る */
    #chart-container {
      width: 2000px;             /* ★ 横を2,000pxに固定 */
      margin: 0 auto;
      background-color: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      padding: 40px 40px 20px;
    }

    /* Safariでも縮まないようにする */
    #assetChart {
      width: 4000px !important;   /* ★ canvas自体も4,000px */
      height: 520px !important;   /* ★ 見やすい高さ */
      display: block;
    }
  </style>
</head>
<body>
  <h1>資産推移（2017年10月〜2025年10月）🌷</h1>
  <p>ピンク：資産額（万円）／ ミント：前月との差（万円）</p>

  <div class="scroll-wrapper">
    <div id="chart-container">
      <!-- width/heightもHTML側で指定しておくとSafariが素直になる -->
      <canvas id="assetChart" width="4000" height="520"></canvas>
    </div>
  </div>

    <!-- ▼ここから追加部分（年次グラフ）▼ -->
  <h2 style="margin-top:60px;">年ごとのまとめグラフ 🎯</h2>
  <canvas id="yearSummaryChart" width="1100" height="420"></canvas>
  <!-- ▲ここまで追加部分▲ -->

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    const assetData = [
      { month: "2017年10月", value: 1474 },
      { month: "2017年10月", value: 1484 },
      { month: "2017年11月", value: 1494 },
      { month: "2017年12月", value: 1561 },
      { month: "2018年1月",  value: 1582 },
      { month: "2018年2月",  value: 1579 },
      { month: "2018年3月",  value: 1588 },
      { month: "2018年4月",  value: 1594 },
      { month: "2018年5月",  value: 1603 },
      { month: "2018年6月",  value: 1644 },
      { month: "2018年7月",  value: 1665 },
      { month: "2018年8月",  value: 1657 },
      { month: "2018年9月",  value: 1650 },
      { month: "2018年10月", value: 1639 },
      { month: "2018年11月", value: 1674 },
      { month: "2018年12月", value: 1667 },

      { month: "2019年1月",  value: 1721 },
      { month: "2019年2月",  value: 1730 },
      { month: "2019年3月",  value: 1734 },
      { month: "2019年4月",  value: 1725 },
      { month: "2019年5月",  value: 1745 },
      { month: "2019年6月",  value: 1808 },
      { month: "2019年7月",  value: 1865 },
      { month: "2019年8月",  value: 1856 },
      { month: "2019年9月",  value: 1881 },
      { month: "2019年10月", value: 1883 },
      { month: "2019年11月", value: 1883 },
      { month: "2019年12月", value: 1938 },

      { month: "2020年1月",  value: 1968 },
      { month: "2020年2月",  value: 1951 },
      { month: "2020年3月",  value: 1940 },
      { month: "2020年4月",  value: 1984 },
      { month: "2020年5月",  value: 1929 },
      { month: "2020年6月",  value: 1994 },
      { month: "2020年7月",  value: 2003 },
      { month: "2020年8月",  value: 2030 },
      { month: "2020年9月",  value: 2075 },
      { month: "2020年10月", value: 2090 },
      { month: "2020年11月", value: 2147 },
      { month: "2020年12月", value: 2209 },

      { month: "2021年1月",  value: 2247 },
      { month: "2021年2月",  value: 2266 },
      { month: "2021年3月",  value: 2307 },
      { month: "2021年4月",  value: 2323 },
      { month: "2021年5月",  value: 2350 },
      { month: "2021年6月",  value: 2432 },
      { month: "2021年7月",  value: 2445 },
      { month: "2021年8月",  value: 2490 },
      { month: "2021年9月",  value: 2498 },
      { month: "2021年10月", value: 2533 },
      { month: "2021年11月", value: 2529 },
      { month: "2021年12月", value: 2608 },

      { month: "2022年2月",  value: 2616 },
      { month: "2022年3月",  value: 2619 },
      { month: "2022年4月",  value: 2662 },
      { month: "2022年5月",  value: 2656 },
      { month: "2022年6月",  value: 2669 },
      { month: "2022年8月",  value: 2740 },
      { month: "2022年11月", value: 2772 },
      { month: "2022年12月", value: 2778 },
      { month: "2022年12月", value: 2815 },
      { month: "2023年1月",  value: 2850 },
      { month: "2023年2月",  value: 2887 },
      { month: "2023年3月",  value: 2885 },
      { month: "2023年5月",  value: 2956 },
      { month: "2023年6月",  value: 3117 },
      { month: "2023年8月",  value: 4020 },
      { month: "2023年10月", value: 4017 },
      { month: "2023年11月", value: 4154 },
      { month: "2023年12月", value: 4383 },

      { month: "2024年1月",  value: 4382 },
      { month: "2024年3月",  value: 4502 },
      { month: "2024年4月",  value: 4507 },
      { month: "2024年5月",  value: 4552 },
      { month: "2024年6月",  value: 4724 },
      { month: "2024年7月",  value: 4735 },
      { month: "2024年8月",  value: 4717 },
      { month: "2024年9月",  value: 4728 },
      { month: "2024年10月", value: 4831 },
      { month: "2024年11月", value: 4759 },
      { month: "2024年12月", value: 4909 },

      { month: "2025年1月",  value: 4904 },
      { month: "2025年2月",  value: 4845 },
      { month: "2025年3月",  value: 4829 },
      { month: "2025年4月",  value: 4826 },
      { month: "2025年5月",  value: 4960 },
      { month: "2025年6月",  value: 5197 },
      { month: "2025年7月",  value: 5298 },
      { month: "2025年8月",  value: 5347 },
      { month: "2025年9月",  value: 5429 },
      { month: "2025年10月", value: 5578 }
    ];

    const labels = assetData.map(d => d.month);
    const assetAmounts = assetData.map(d => d.value);
    const diffs = assetAmounts.map((v,i) => i === 0 ? 0 : v - assetAmounts[i-1]);

    const ctx = document.getElementById("assetChart");

    const pink = "rgba(255, 153, 204, 0.7)";
    const pinkDark = "rgba(255, 105, 180, 1)";
    const gray = "rgba(200, 200, 200, 0.7)";
    const mint = "rgba(153, 230, 204, 1)";

    new Chart(ctx, {
      data: {
        labels: labels,
        datasets: [
          {
            type: "bar",
            label: "資産額（万円）",
            data: assetAmounts,
            yAxisID: "yAssets",
            backgroundColor: pink,
            borderColor: pinkDark,
            borderWidth: 1,
            borderRadius: 4,
            barPercentage: 0.9,
            categoryPercentage: 1.0
          },
          {
            type: "line",
            label: "増減額（万円）",
            data: diffs,
            yAxisID: "yDiffs",
            tension: 0.3,
            borderColor: mint,
            backgroundColor: "rgba(153,230,204,0.25)",
            pointBackgroundColor: diffs.map(v => v >= 0 ? mint : gray),
            pointBorderColor: diffs.map(v => v >= 0 ? mint : gray),
            pointRadius: 3,
            pointHoverRadius: 5
          }
        ]
      },
      options: {
        responsive: false,  // ←ここも固定しておくとSafariで縮みにくい
        interaction: { mode: "index", intersect: false },
        scales: {
          yAssets: {
            position: "left",
            title: { display: true, text: "資産額（万円）" },
            suggestedMin: 1400,
            suggestedMax: 6000,
            grid: { color: "rgba(255,182,193,0.25)" }
          },
          yDiffs: {
            position: "right",
            title: { display: true, text: "増減額（万円）" },
            suggestedMin: -200,
            suggestedMax: 1200,
            grid: { drawOnChartArea: false }
          },
          x: {
            ticks: {
              maxRotation: 60,
              minRotation: 60
            }
          }
        },
        plugins: {
          legend: { labels: { color: "#555" } }
        }
      }
    });

  // =========================
  // 年次データを自動で抽出して複合グラフを描画
  // =========================

  // 年ごとにその年で一番新しい月のデータを抽出
  const yearlyLatest = {};
  assetData.forEach(d => {
    const m = d.month.match(/(\d{4})年(\d{1,2})月/);
    if (!m) return;
    const year = m[1];
    const month = Number(m[2]);
    const value = d.value;
    if (!yearlyLatest[year] || month > yearlyLatest[year].month) {
      yearlyLatest[year] = { month, value };
    }
  });

  // 年を昇順に並べて配列化
  const yearKeys = Object.keys(yearlyLatest).map(Number).sort((a, b) => a - b);
  const yearLabels = [];
  const yearEndValues = [];
  const yearDiffs = [];

  yearKeys.forEach((y, i) => {
    yearLabels.push(y + "年");
    const val = yearlyLatest[y].value;
    yearEndValues.push(val);
    if (i === 0) {
      yearDiffs.push(0);
    } else {
      yearDiffs.push(val - yearlyLatest[yearKeys[i - 1]].value);
    }
  });

  // キャンバスを取得
  const ctxYear = document.getElementById("yearSummaryChart").getContext("2d");

  // カラー設定
  const pastelBars = yearEndValues.map(() => "rgba(255, 182, 193, 0.75)");
  const lineColor = "rgba(153, 230, 204, 1)";

  new Chart(ctxYear, {
    data: {
      labels: yearLabels,
      datasets: [
        {
          type: "bar",
          label: "年末資産額（万円）",
          data: yearEndValues,
          yAxisID: "yLeft",
          backgroundColor: pastelBars,
          borderColor: "rgba(255, 105, 180, 1)",
          borderWidth: 1,
          borderRadius: 6
        },
        {
          type: "line",
          label: "前年からの増加額（万円）",
          data: yearDiffs,
          yAxisID: "yRight",
          borderColor: lineColor,
          backgroundColor: "rgba(153, 230, 204, 0.25)",
          tension: 0.3,
          pointBackgroundColor: yearDiffs.map(v => v >= 0 ? lineColor : "rgba(200,200,200,1)"),
          pointRadius: 5
        }
      ]
    },
    options: {
      responsive: true,
      plugins: {
        title: {
          display: true,
          text: "年末時点の資産と前年比の増加額 🪴",
          font: { size: 18 }
        },
        tooltip: {
          callbacks: {
            label: ctx => `${ctx.dataset.label}: ${ctx.raw} 万円`
          }
        }
      },
      scales: {
        yLeft: {
          position: "left",
          title: { display: true, text: "資産額（万円）" },
          suggestedMin: 0
        },
        yRight: {
          position: "right",
          title: { display: true, text: "前年比の増加額（万円）" },
          grid: { drawOnChartArea: false }
        }
      }
    }
  });
    
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>2025年 資産推移</title>
  <style>
    body {
      font-family: 'Hiragino Maru Gothic ProN', 'Arial Rounded MT Bold', sans-serif;
      background-color: #fffafc;
      color: #555;
      text-align: center;
      margin: 40px auto;
      max-width: 900px;
    }
    h1 { color: #e86e94; }
    #chart-container {
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
      background-color: #ffffff;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      padding: 30px;
    }
  </style>
</head>
<body>
  <h1>2025年 資産推移 🌷</h1>
  <p>棒＝資産額（万円）／ 線＝前月との差</p>

  <div id="chart-container">
    <canvas id="assetChart"></canvas>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    // ★ここだけ毎月足すゾーン★
    // month: "表示したい名前", value: 資産額（万円）
    const assetData = [
      { month: "2025年1月",  value: 4904 },
      { month: "2025年2月",  value: 4845 },
      { month: "2025年3月",  value: 4829 },
      { month: "2025年4月",  value: 4826 },
      { month: "2025年5月",  value: 4960 },
      { month: "2025年6月",  value: 5197 },
      { month: "2025年7月",  value: 5298 },
      { month: "2025年8月",  value: 5347 },
      { month: "2025年9月",  value: 5429 },
      { month: "2025年10月", value: 5578 },
      // ↓11月が出たらここに1行足すだけ！
      // { month: "2025年11月", value: 5650 },
      // { month: "2025年12月", value: 5780 },
    ];

    // ↓ここから下は毎月いじらんでOK
    const labels = assetData.map(d => d.month);
    const assetAmounts = assetData.map(d => d.value);

    // 増減を自動計算
    const diffs = assetAmounts.map((v, i) => {
      if (i === 0) return 0;
      return v - assetAmounts[i - 1];
    });

    const ctx = document.getElementById("assetChart");

    const pink = "rgba(255, 153, 204, 0.7)";
    const pinkDark = "rgba(255, 105, 180, 1)";
    const gray = "rgba(200, 200, 200, 0.6)";
    const mint = "rgba(153, 230, 204, 1)";

    new Chart(ctx, {
      data: {
        labels: labels,
        datasets: [
          {
            type: "bar",
            label: "資産額（万円）",
            data: assetAmounts,
            yAxisID: "yAssets",
            backgroundColor: pink,
            borderColor: pinkDark,
            borderWidth: 1,
            borderRadius: 6
          },
          {
            type: "line",
            label: "増減額（万円）",
            data: diffs,
            yAxisID: "yDiffs",
            tension: 0.4,
            borderColor: mint,
            backgroundColor: "rgba(153,230,204,0.25)",
            pointBackgroundColor: diffs.map(v => v >= 0 ? mint : gray),
            pointBorderColor: diffs.map(v => v >= 0 ? mint : gray),
            pointRadius: 5
          }
        ]
      },
      options: {
        responsive: true,
        interaction: { mode: "index", intersect: false },
        scales: {
          yAssets: {
            position: "left",
            title: { display: true, text: "資産額（万円）" },
            // 範囲はデータ見て自動にするならコメントアウトでもOK
            suggestedMin: 4700,
            suggestedMax: 5800,
            grid: { color: "rgba(255,182,193,0.2)" }
          },
          yDiffs: {
            position: "right",
            title: { display: true, text: "増減額（万円）" },
            suggestedMin: -100,
            suggestedMax: 250,
            grid: { drawOnChartArea: false }
          }
        },
        plugins: {
          legend: { labels: { color: "#666" } },
          tooltip: {
            backgroundColor: "#ffe6ef",
            titleColor: "#e86e94",
            bodyColor: "#444",
            borderColor: "#ffc0cb",
            borderWidth: 1,
            callbacks: {
              label: (ctx) => `${ctx.dataset.label}: ${ctx.raw} 万円`
            }
          }
        }
      }
    });
  </script>
</body>
</html>
